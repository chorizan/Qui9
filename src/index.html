<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d056f" />

    <!-- SEO base (SeoService actualiza estas etiquetas por ruta) -->
    <title>QUI9 — Quinua Peruana Premium</title>
    <meta
      name="description"
      content="Descubre nuestra quinua peruana, seleccionada desde los Andes y llevada hasta tu mesa."
    />
    <meta name="author" content="QUI9" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://qui9.pe/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QUI9" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="QUI9 — Quinua Peruana Premium" />
    <meta
      property="og:description"
      content="Descubre nuestra quinua peruana, seleccionada desde los Andes y llevada hasta tu mesa."
    />
    <meta property="og:url" content="https://qui9.pe/" />
    <meta property="og:image" content="https://qui9.pe/assets/brand/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QUI9 — Quinua Peruana Premium" />
    <meta
      name="twitter:description"
      content="Descubre nuestra quinua peruana, seleccionada desde los Andes y llevada hasta tu mesa."
    />
    <meta name="twitter:image" content="https://qui9.pe/assets/brand/og-cover.png" />

    <link rel="icon" type="image/png" href="assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="assets/brand/favicon.png" />

    <!-- Tipografías: display serif + sans limpia (máximo 2 familias) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@200;300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@200;300;400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Datos estructurados de organización -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "QUI9",
        "url": "https://qui9.pe/",
        "logo": "https://qui9.pe/assets/brand/qui9-logo.png",
        "description": "Quinua peruana premium seleccionada en los Andes.",
        "slogan": "El sabor de los Andes.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "PE"
        }
      }
    </script>

    <style>
      /* Pintado inicial: evita el destello blanco antes de que Angular arranque */
      html,
      body {
        background-color: #0d056f;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <div style="padding: 40px; color: #f5f0e6; font-family: sans-serif">
        Esta experiencia requiere JavaScript activado. QUI9 — Quinua peruana premium.
      </div>
    </noscript>
  </body>
</html>
