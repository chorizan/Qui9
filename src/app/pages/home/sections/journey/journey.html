<section class="journey section" id="recorrido" aria-labelledby="journey-title" #root>
  <div class="container">
    <app-section-header
      align="center"
      eyebrow="El recorrido"
      [lines]="['De los Andes', 'a tu mesa.']"
      text="Seis etapas entre la altura y tu cocina. Cada una deja una marca en el grano."
    />
    <h2 class="sr-only" id="journey-title">Recorrido del producto</h2>

    <div class="journey__map">
      <!-- Trazado orgánico dibujado con el scroll -->
      <svg
        class="journey__svg"
        [attr.viewBox]="'0 0 ' + viewBox.width + ' ' + viewBox.height"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          #path
          class="journey__path"
          d="M40,190 C170,80 300,60 430,120 C560,180 640,210 760,150 C880,90 960,40 1160,70"
          fill="none"
          vector-effect="non-scaling-stroke"
        />
        <path
          #trail
          class="journey__trail"
          d="M40,190 C170,80 300,60 430,120 C560,180 640,210 760,150 C880,90 960,40 1160,70"
          fill="none"
          vector-effect="non-scaling-stroke"
        />
      </svg>

      <ol class="journey__steps">
        @for (step of steps; track step.id; let i = $index) {
          <li
            class="jstep"
            [class.is-active]="i <= activeIndex()"
            [style.left.%]="isDesktop() ? nodePositions()[i]?.x : null"
            [style.top.%]="isDesktop() ? nodePositions()[i]?.y : null"
            appReveal
            [revealDelay]="i * 0.06"
          >
            <span class="jstep__node" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" class="jstep__icon">
                @switch (step.icon) {
                  @case ('mountain') {
                    <path d="M2 19l6.5-11 4 6 2.5-4 7 9H2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
                  }
                  @case ('sprout') {
                    <path d="M12 20v-7m0 0c0-3-2.4-5-5.5-5 0 3 2.4 5 5.5 5Zm0 0c0-3.3 2.7-6 6-6 0 3.3-2.7 6-6 6Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                  }
                  @case ('harvest') {
                    <path d="M12 21V9m0 0c-2 0-3.5-1.6-3.5-3.5S10 2 12 2s3.5 1.6 3.5 3.5S14 9 12 9Zm-6 4c1.8 0 3 1.4 3 3H6c-1.7 0-3-1.3-3-3h3Zm12 0c-1.8 0-3 1.4-3 3h3c1.7 0 3-1.3 3-3h-3Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
                  }
                  @case ('select') {
                    <path d="M4 7h16M6.5 12h11M9 17h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
                  }
                  @case ('package') {
                    <path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5v-7Zm0 0 8 4.5m0 0 8-4.5m-8 4.5V20" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
                  }
                  @case ('home') {
                    <path d="M4 11 12 4l8 7v9h-5v-5H9v5H4v-9Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
                  }
                }
              </svg>
            </span>

            <div class="jstep__text">
              <span class="jstep__index t-mono-num">0{{ i + 1 }}</span>
              <h3 class="jstep__label">{{ step.label }}</h3>
              <p class="jstep__caption t-small">{{ step.caption }}</p>
            </div>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
