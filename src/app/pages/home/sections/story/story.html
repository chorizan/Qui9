<section class="story section section--light" id="historia" aria-labelledby="story-title">
  <div class="container">
    <app-section-header
      eyebrow="Nuestra historia"
      [lines]="['Cinco etapas', 'de un mismo grano.']"
      text="Del vínculo con los Andes al futuro de la quinua peruana: así entendemos el trabajo con el grano."
    />

    <ol class="timeline" #track>
      <span class="timeline__rail" aria-hidden="true">
        <span class="timeline__progress" #progress></span>
      </span>

      @for (chapter of chapters; track chapter.index; let i = $index) {
        <li class="chapter" [class.chapter--right]="i % 2 === 1" appReveal [revealDelay]="0.05">
          <span class="chapter__node" aria-hidden="true"></span>

          <div class="chapter__content">
            <span class="chapter__index t-mono-num">{{ chapter.index }}</span>
            <h3 class="chapter__title">{{ chapter.title }}</h3>
            <p class="chapter__subtitle t-eyebrow">{{ chapter.subtitle }}</p>
            <p class="chapter__text t-body">{{ chapter.text }}</p>
          </div>

          @if (chapter.image) {
            <figure class="chapter__media">
              <app-img [image]="chapter.image" sizes="(min-width: 1024px) 34vw, 88vw" />
            </figure>
          }
        </li>
      }
    </ol>
  </div>
</section>
